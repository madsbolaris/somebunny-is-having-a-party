# Host manifest — read by scripts/generate_mosaic.py and the helper scripts.
name = "The Potluck"
host = "Finneas, Ace Archer"
commander = "Finneas, Ace Archer"
tagline = "Somebunny made too much. Everybunny brought a dish, nobody leaves hungry — they leave enormous."
strategy = "Selesnya (G/W) Food-and-tokens potluck. Everyone brings a dish (Food tokens) and leaves the table bigger (+1/+1 counters), because in this deck a Food is 3 stored life and life turns into power: Heliod converts lifegain to counters, Archangel pumps the board, Well of Lost Dreams and Academy Manufactor cash the feast into cards and mana, and Kitchen Finks loops with Heliod for infinite life. Finneas showers the whole crowd with counters each attack, Maskwood makes every guest count for every payoff, and the game ends on a counter-swollen lifelink board or the Heliod + Walking Ballista combo — a feast that never stops growing."
brackets = ["b4"]

# Extra cards bought as foil (beyond the commander + pinned trio).
extra_foils = ["Placid Rottentail"]

[mosaic]
# A card is "highlighted" (marker + sorts first within its color/type group) when
# any of these theme_analysis columns contains a ✅ for that card.
highlight_columns = ["Core?"]
# Cards forced to the end of their color section instead of sorting with their type.
end_of_color = []
# Borderless & showcase printings, pinned right after the commander. The featured
# trio next to Finneas: Gilded Goose (BLC 83), Archangel of Thune (SLD 1337), and
# Mycoloth (SLD 2205, the "Cordyceps Rat King" borderless). Tireless Provisioner
# now runs its normal LTC 262 print and sorts naturally, as does Heliod (CMM 29).
pinned = ["Gilded Goose", "Archangel of Thune", "Mycoloth"]
